<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Accurate Weather</title>
  <link rel="shortcut icon" href="assets/images.png" type="image/x-icon">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

  <link rel="stylesheet" href="style.css" />

</head>

<body>
  <main class="main-container">
    <header class="input-container">
      <input class="city-input" placeholder="Search City" type="text" />
      <button class="search-btn">
        <a class="search-btn" href="#">
          <i class="fa-solid fa-magnifying-glass"></i>
        </a>
      </button>
    </header>

    <section class="weather-info" style="display:none">
      <div class="location-date-container">
        <div class="location">
          <span class="material-symbols-outlined">
            location_on
          </span>
          <h4 class="country-txt">India</h4>
        </div>
        <h5 class="current-date-text">Mon, 05 Aug</h5>
      </div>

      <div class="weather-summary-container">
        <img src="assets/weather/clear.svg" class="weather-summary-img">
        <div class="weather-summary-info">
          <h1 class="temp-text">41 °C</h1>
          <h3 class="condition-txt regular-txt">Sunny</h3>
        </div>
      </div>

      <div class="weather-conditions-container">
        <div class="condition-item">
          <span class="material-symbols-outlined">water_drop</span>
          <div class="condition-info">
            <h5 class="regular-txt">Humidity</h5>
            <h5 class="humidity-value-txt">45%</h5>
          </div>
        </div>

        <div class="condition-item">
          <span class="material-symbols-outlined">air</span>
          <div class="condition-info">
            <h5 class="regular-txt">Wind Speed</h5>
            <h5 class="wind-value-txt">6 M/s</h5>
          </div>
        </div>
      </div>

      <div class="forecast-items-conatiner">
        <div class="forecast-item">
          <div class="forecast-item-data regular-txt">05 Aug</div>
          <img src="assets/weather/thunderstorm.svg" alt="" class="forecast-item-img">
          <h5 class="forecast-item-temp">38 °C</h5>
        </div>
        <div class="forecast-item">
          <div class="forecast-item-data regular-txt">05 Aug</div>
          <img src="assets/weather/thunderstorm.svg" alt="" class="forecast-item-img">
          <h5 class="forecast-item-temp">38 °C</h5>
        </div>
        <div class="forecast-item">
          <div class="forecast-item-data regular-txt">05 Aug</div>
          <img src="assets/weather/thunderstorm.svg" alt="" class="forecast-item-img">
          <h5 class="forecast-item-temp">38 °C</h5>
        </div>
        <div class="forecast-item">
          <div class="forecast-item-data regular-txt">05 Aug</div>
          <img src="assets/weather/thunderstorm.svg" alt="" class="forecast-item-img">
          <h5 class="forecast-item-temp">38 °C</h5>
        </div>
      </div>
    </section>

    <section class="search-city section-message">
      <img src="assets/message/search-city.png">
      <div>
        <h1>Search City</h1>
        <h4 class="regular-txt">Find out the weather conditions of the city</h4>
      </div>
    </section>

    <section class="not-found section-message" style="display:none">
      <img src="assets/message/not-found.png">
      <div>
        <h1>Search City</h1>
        <h4 class="regular-txt">Find out the weather conditions of the city</h4>
      </div>
    </section>
  </main>

  <script src="script.js" defer></script>

</body>

</html>
