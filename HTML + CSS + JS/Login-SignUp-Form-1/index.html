<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Auth Page</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-container" id="auth-container">
        <!-- Login Form -->
        <div class="auth-form" id="login-form">
            <h2 class="form-title">Welcome Back</h2>
            <div id="login-error" class="error-message"></div>
            <div id="login-success" class="success-message"></div>
            <form id="loginForm">
                <div class="form-group">
                    <label for="login-email" class="form-label">Email</label>
                    <input type="email" id="login-email" class="form-input" required>
                </div>
                <div class="form-group">
                    <label for="login-password" class="form-label">Password</label>
                    <input type="password" id="login-password" class="form-input" required>
                </div>
                <button type="submit" class="btn btn-primary">Login</button>
                <button type="button" class="btn btn-secondary" id="forgot-password">Forgot Password?</button>
            </form>
            <div class="switch-form">
                Don't have an account? <a href="#" class="switch-link" id="show-signup">Sign Up</a>
            </div>
            <div class="social-login">
                <div class="social-title">Or login with</div>
                <div class="social-buttons">
                    <a href="#" class="social-btn google-btn"><i class="fab fa-google"></i></a>
                    <a href="#" class="social-btn facebook-btn"><i class="fab fa-facebook-f"></i></a>
                    <a href="#" class="social-btn twitter-btn"><i class="fab fa-twitter"></i></a>
                </div>
            </div>
        </div>

        <!-- Signup Form -->
        <div class="auth-form" id="signup-form" style="display: none;">
            <h2 class="form-title">Create Account</h2>
            <div id="signup-error" class="error-message"></div>
            <div id="signup-success" class="success-message"></div>
            <form id="signupForm">
                <div class="form-group">
                    <label for="signup-name" class="form-label">Full Name</label>
                    <input type="text" id="signup-name" class="form-input" required>
                </div>
                <div class="form-group">
                    <label for="signup-email" class="form-label">Email</label>
                    <input type="email" id="signup-email" class="form-input" required>
                </div>
                <div class="form-group">
                    <label for="signup-password" class="form-label">Password</label>
                    <input type="password" id="signup-password" class="form-input" required>
                </div>
                <div class="form-group">
                    <label for="signup-confirm-password" class="form-label">Confirm Password</label>
                    <input type="password" id="signup-confirm-password" class="form-input" required>
                </div>
                <button type="submit" class="btn btn-primary">Sign Up</button>
            </form>
            <div class="switch-form">
                Already have an account? <a href="#" class="switch-link" id="show-login">Login</a>
            </div>
            <div class="social-login">
                <div class="social-title">Or sign up with</div>
                <div class="social-buttons">
                    <a href="#" class="social-btn google-btn"><i class="fab fa-google"></i></a>
                    <a href="#" class="social-btn facebook-btn"><i class="fab fa-facebook-f"></i></a>
                    <a href="#" class="social-btn twitter-btn"><i class="fab fa-twitter"></i></a>
                </div>
            </div>
        </div>

        <!-- Forgot Password Form -->
        <div class="auth-form" id="forgot-form" style="display: none;">
            <h2 class="form-title">Reset Password</h2>
            <div id="forgot-error" class="error-message"></div>
            <div id="forgot-success" class="success-message"></div>
            <form id="forgotForm">
                <div class="form-group">
                    <label for="forgot-email" class="form-label">Email</label>
                    <input type="email" id="forgot-email" class="form-input" required>
                </div>
                <button type="submit" class="btn btn-primary">Send Reset Link</button>
                <button type="button" class="btn btn-secondary" id="back-to-login">Back to Login</button>
            </form>
        </div>
    </div>

    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>
</html>
