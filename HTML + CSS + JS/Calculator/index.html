<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300&family=Ubuntu:wght@300&display=swap" rel="stylesheet">
    <link href="style.css" rel="stylesheet" type="text/css"/>
    <link href="utils.css" rel="stylesheet" type="text/css"/>
</head>
<body>
    <h1 class="text-center">Calculate Using Calculator</h1>
    <div class="container flex flex-col item-center mx-auto m-w-20">
        <div class="row">
            <input class="input" type="text"/>
        </div>
        <div class="row">
            <button class="btn">AC</button>
            <button class="btn">Pi</button>
            <button class="btn">x!</button>
            <button class="btn">%</button>
    </div>      
        <div class="row">
            <button class="btn">7</button>
            <button class="btn">8</button>
            <button class="btn">9</button>
            <button class="btn">*</button>
        </div>
        <div class="row">
            <button class="btn">4</button>
            <button class="btn">5</button>
            <button class="btn">6</button>
            <button class="btn">-</button>
    </div>
    <div class="row">
            <button class="btn">1</button>
            <button class="btn">2</button>
            <button class="btn">3</button>
            <button class="btn">+</button>
    </div>
    <div class="row">
            <button class="btn">0</button>
            <button class="btn">.</button>
            <button class="btn">/</button>
            <button class="btn">=</button>
    </div> 
          
    <script src="script.js"></script>
</body>
</html>
