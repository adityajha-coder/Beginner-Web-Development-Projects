<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chracter Counter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="conatiner">
        <h2> Live Character Counter</h2>
        <textarea id="textarea" class="textarea" placeholder="Write Your Text Here...." maxlength="50"></textarea>
        <div class="counter-container">
            <p>Total Characters: 
                <span class="total-counter" id="total-counter">0</span>
            </p>
            <p>Remaining: 
                <span class="remaining-counter" id="remaining-counter">50</span>
            </p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
